# Builds the service image for PCs and Raspberry Pi and pushes it to Docker Hub on every push
# to main that touches the service, tagged latest, the pom.xml version and the commit.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
name: Service image

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        working-directory: service
        run: mvn -B -q test

      - name: Version
        id: version
        working-directory: service
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            geireilertsen/dj:latest
            geireilertsen/dj:${{ steps.version.outputs.version }}
            geireilertsen/dj:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
